<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="800mm" height="1200mm" viewBox="0 0 800 1200"><rect x="0" y="0" width="800" height="1200" fill="#F3E8CE" stroke="none" stroke-width="1" /><image x="330" y="302" width="420" height="630" href="assets/retro.png" preserveAspectRatio="none" /><line x1="54" y1="105" x2="746" y2="105" stroke="#C3BDA7" stroke-width="1" /><text x="54" y="80" font-family="Microsoft YaHei, sans-serif" font-size="35" font-weight="700" fill="#153C46">GlobeChain</text><text x="414" y="72" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#DE5225">THE WORLD WITHIN A PRODUCT</text><text x="54" y="195" font-family="Microsoft YaHei, sans-serif" font-size="60" font-weight="700" fill="#153C46">一件商品，</text><text x="54" y="274" font-family="Microsoft YaHei, sans-serif" font-size="60" font-weight="700" fill="#153C46">连接整个世界。</text><text x="56" y="328" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#557170">全球商品供应链与贸易数据可视化</text><rect x="54" y="345" width="75" height="6" fill="#DE5225" stroke="none" stroke-width="1" /><line x1="308" y1="905" x2="308" y2="400" stroke="#DE5225" stroke-width="1" /><text x="54" y="440" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#DE5225">01</text><text x="111" y="440" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#153C46">拆解商品</text><text x="56" y="483" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#557170">从成品、部件到原料，</text><text x="56" y="509" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#557170">逐层读懂商品结构。</text><line x1="56" y1="533" x2="269" y2="533" stroke="#C3BDA7" stroke-width="0.7" /><text x="54" y="603" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#DE5225">02</text><text x="111" y="603" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#153C46">看见分工</text><text x="56" y="646" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#557170">沿代表性路线展开，</text><text x="56" y="672" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#557170">看见国家与生产环节。</text><line x1="56" y1="696" x2="269" y2="696" stroke="#C3BDA7" stroke-width="0.7" /><text x="54" y="766" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#DE5225">03</text><text x="111" y="766" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#153C46">核验贸易</text><text x="56" y="809" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#557170">查看官方统计观察，</text><text x="56" y="835" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#557170">带着来源继续研究。</text><text x="348" y="954" font-family="Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#557170">CONCEPT VISUAL / 商品全球联系概念图</text><rect x="54" y="981" width="692" height="53" fill="#DE5225" stroke="none" stroke-width="1" /><text x="72" y="1016" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#F3E8CE">代表性供应链  /  官方贸易统计</text><text x="54" y="1074" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#557170">分开展示，各自可回到来源。</text><line x1="54" y1="1106" x2="746" y2="1106" stroke="#C3BDA7" stroke-width="0.7" /><text x="54" y="1134" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#557170">主视觉为概念示意；代表性路线不代表唯一真实路线。</text><text x="54" y="1158" font-family="Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#557170">参赛视觉设计初稿</text><text x="601" y="1158" font-family="Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#557170">GLOBECHAIN / 2026</text></svg>