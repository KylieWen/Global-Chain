<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 595.276 841.89"><rect x="0" y="0.0" width="595.276" height="841.89" fill="#F1F5FC" stroke="none" stroke-width="1" /><image x="138" y="191.89" width="320" height="480" href="assets/farfuture.png" preserveAspectRatio="none" /><text x="36" y="46.889999999999986" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#243C56">GlobeChain</text><text x="36" y="69.88999999999999" font-family="Microsoft YaHei, sans-serif" font-size="7.5" font-weight="400" fill="#6E819A">A WORLD INSIDE EVERY PRODUCT</text><circle cx="536" cy="47.889999999999986" r="16" fill="none" stroke="#5E88BE" stroke-width="0.7" /><circle cx="536" cy="47.889999999999986" r="10" fill="none" stroke="#CCD9E9" stroke-width="0.6" /><text x="36" y="125.88999999999999" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#243C56">一件商品，</text><text x="36" y="171.89" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#243C56">连接整个世界。</text><line x1="36" y1="694.89" x2="559" y2="694.89" stroke="#CCD9E9" stroke-width="0.7" /><text x="36" y="715.89" font-family="Microsoft YaHei, sans-serif" font-size="8" font-weight="700" fill="#5E88BE">01</text><text x="59" y="716.89" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#243C56">拆解商品</text><text x="214" y="715.89" font-family="Microsoft YaHei, sans-serif" font-size="8" font-weight="700" fill="#5E88BE">02</text><text x="237" y="716.89" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#243C56">看见分工</text><text x="392" y="715.89" font-family="Microsoft YaHei, sans-serif" font-size="8" font-weight="700" fill="#5E88BE">03</text><text x="415" y="716.89" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#243C56">核验贸易</text><text x="36" y="757.89" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#243C56">全球商品供应链与贸易数据可视化</text><text x="36" y="780.89" font-family="Microsoft YaHei, sans-serif" font-size="8" font-weight="400" fill="#6E819A">代表性供应链与官方贸易统计，分开展示。</text><line x1="36" y1="794.89" x2="559" y2="794.89" stroke="#CCD9E9" stroke-width="0.6" /><text x="36" y="811.89" font-family="Microsoft YaHei, sans-serif" font-size="6.8" font-weight="400" fill="#6E819A">主视觉为概念示意；代表性路线不代表唯一真实路线。</text><text x="464" y="811.89" font-family="Microsoft YaHei, sans-serif" font-size="6.8" font-weight="400" fill="#6E819A">参赛视觉设计初稿</text></svg>