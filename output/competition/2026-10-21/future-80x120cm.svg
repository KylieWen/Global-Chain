<svg xmlns="http://www.w3.org/2000/svg" width="800mm" height="1200mm" viewBox="0 0 800 1200"><rect x="0" y="0" width="800" height="1200" fill="#03162B" stroke="none" stroke-width="1" /><image x="330" y="302" width="420" height="630" href="assets/future.png" preserveAspectRatio="none" /><line x1="54" y1="105" x2="746" y2="105" stroke="#28445B" stroke-width="1" /><text x="54" y="80" font-family="Microsoft YaHei, sans-serif" font-size="35" font-weight="700" fill="#F1F7FE">GlobeChain</text><text x="414" y="72" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="700" fill="#66E2D3">TRACE THE CONNECTIONS</text><text x="54" y="195" font-family="Microsoft YaHei, sans-serif" font-size="60" font-weight="700" fill="#F1F7FE">一件商品，</text><text x="54" y="274" font-family="Microsoft YaHei, sans-serif" font-size="60" font-weight="700" fill="#F1F7FE">连接整个世界。</text><text x="56" y="328" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#9AB4CA">全球商品供应链与贸易数据可视化</text><line x1="54" y1="354" x2="129" y2="354" stroke="#66E2D3" stroke-width="2" /><line x1="308" y1="900" x2="308" y2="395" stroke="#28445B" stroke-width="0.7" /><text x="54" y="440" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#66E2D3">01</text><text x="111" y="440" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#F1F7FE">拆解商品</text><text x="56" y="483" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#9AB4CA">从成品、部件到原料，</text><text x="56" y="509" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#9AB4CA">逐层读懂商品结构。</text><line x1="56" y1="533" x2="269" y2="533" stroke="#28445B" stroke-width="0.7" /><text x="54" y="603" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#66E2D3">02</text><text x="111" y="603" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#F1F7FE">看见分工</text><text x="56" y="646" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#9AB4CA">沿代表性路线展开，</text><text x="56" y="672" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#9AB4CA">看见国家与生产环节。</text><line x1="56" y1="696" x2="269" y2="696" stroke="#28445B" stroke-width="0.7" /><text x="54" y="766" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#66E2D3">03</text><text x="111" y="766" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#F1F7FE">核验贸易</text><text x="56" y="809" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#9AB4CA">查看官方统计观察，</text><text x="56" y="835" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#9AB4CA">带着来源继续研究。</text><text x="348" y="954" font-family="Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#9AB4CA">CONCEPT VISUAL / 商品全球联系概念图</text><line x1="54" y1="982" x2="746" y2="982" stroke="#28445B" stroke-width="1" /><text x="54" y="1028" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#F1F7FE">代表性供应链  /  官方贸易统计</text><text x="54" y="1074" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#9AB4CA">分开展示，各自可回到来源。</text><line x1="54" y1="1106" x2="746" y2="1106" stroke="#28445B" stroke-width="0.7" /><text x="54" y="1134" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#9AB4CA">主视觉为概念示意；代表性路线不代表唯一真实路线。</text><text x="54" y="1158" font-family="Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#9AB4CA">参赛视觉设计初稿</text><text x="601" y="1158" font-family="Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#9AB4CA">GLOBECHAIN / 2026</text></svg>