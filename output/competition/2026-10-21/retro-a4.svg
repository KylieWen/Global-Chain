<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 595.276 841.89"><rect x="0" y="0.0" width="595.276" height="841.89" fill="#F3E8CE" stroke="none" stroke-width="1" /><image x="138" y="191.89" width="320" height="480" href="assets/retro.png" preserveAspectRatio="none" /><rect x="32" y="34.889999999999986" width="7" height="20" fill="#DE5225" stroke="none" stroke-width="1" /><text x="48" y="55.889999999999986" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#153C46">GlobeChain</text><text x="34" y="93.88999999999999" font-family="Microsoft YaHei, sans-serif" font-size="8" font-weight="700" fill="#DE5225">THE WORLD WITHIN A PRODUCT</text><text x="34" y="141.89" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#153C46">一件商品，连接整个世界。</text><line x1="34" y1="164.89" x2="561" y2="164.89" stroke="#153C46" stroke-width="1" /><rect x="34" y="681.89" width="527" height="28" fill="#DE5225" stroke="none" stroke-width="1" /><text x="49" y="701.89" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#F3E8CE">拆解商品     /     看见分工     /     核验贸易</text><text x="36" y="757.89" font-family="Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#153C46">全球商品供应链与贸易数据可视化</text><text x="36" y="780.89" font-family="Microsoft YaHei, sans-serif" font-size="8" font-weight="400" fill="#557170">代表性供应链与官方贸易统计，分开展示。</text><line x1="36" y1="794.89" x2="559" y2="794.89" stroke="#C3BDA7" stroke-width="0.6" /><text x="36" y="811.89" font-family="Microsoft YaHei, sans-serif" font-size="6.8" font-weight="400" fill="#557170">主视觉为概念示意；代表性路线不代表唯一真实路线。</text><text x="464" y="811.89" font-family="Microsoft YaHei, sans-serif" font-size="6.8" font-weight="400" fill="#557170">参赛视觉设计初稿</text></svg>